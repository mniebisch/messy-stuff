seed_everything: 42 # false

trainer:
  max_epochs: 50
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: fmp.lit_tools.callbacks.mlflow.MLFlowModelCheckpoint
      init_args:
        dirpath: ./checkpoints
        monitor: val/loss
        mode: min
        save_top_k: 3
        log_top_k_as_artifacts: true
        log_best_as_artifact: false
        log_improvement_history: false
  logger:
    class_path: fmp.lit_tools.callbacks.mlflow.MLFlowSystemMetricsLogger
    init_args:
      experiment_name: sphere
      tracking_uri: "sqlite:///mlruns.db"
      artifact_location: "file:./mlruns"
      log_system_metrics: true  # Enable CPU/GPU/memory tracking
      synchronous: true  # Flush metrics immediately (slower but real-time UI updates)
      tags:
        run_type: training
        project: sphere
model:
  class_path: fmp.models.SphereSliceUNetModule
  init_args:
    in_channels: 15
    out_channels: 1
    output_activation: "sigmoid"
    encoder_name: "resnet18"
    encoder_weights: null
    huber_beta: 0.1
    grad_weight: 0.1
    lambda_fg: 1.0
    lambda_bg: 0.25

data:
  class_path: fmp.datasets.sphere.SphereDataModule
  init_args:
    train_ranges:
      height: [100, 100]
      width: [100, 100]
      depth: [16, 16]
      pixel_size: [1.0, 1.0]
      radius: [1.0, 50.0]
      z_index: 0
    valA_ranges:
      height: [100, 100]
      width: [100, 100]
      depth: [16, 16]
      pixel_size: [1.0, 1.0]
      radius: [1.0, 50.0]
      z_index: 0

    crop_size: null
    batch_size: 256
    train_length: 150000
    valA_num: 4096
    num_workers: 16
    normalize: true
    normalize_radius: false
    add_center_maps: false

    sampling:
      use_radius_buckets: true
      radius_buckets:
        buckets: [[1.0, 6.0], [6.0, 15.0], [15.0, 30.0], [30.0, 50.0]]
        probs:   [0.4, 0.3, 0.2, 0.1]
      mode: mixture
      fixed_hw: true
      fixed_h: 100
      fixed_w: 100
      fixed_depth: 16
      fixed_pixel_size: 1.0
      mixture:
        p_strong: 0.55
        p_medium: 0.2
        p_faint: 0.15
        p_zero: 0.1
        strong_alpha: 0.4
        medium_lo: 0.4
        medium_hi: 0.8
        faint_beta: 0.8
        zero_gamma: 0.1

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-3
lr_scheduler:
  class_path: fmp.lr_schedulers.cosine_annealing_warmup
  init_args:
    warmup_iters: 3
    warmup_factor: 0.01
    total_iters: 50